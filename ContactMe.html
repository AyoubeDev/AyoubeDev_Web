<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="styleContactMe.css">
</head>
<body>
    <div class="contact-container">
        <div class="contact-image">
            <!-- Cambia la ruta de la imagen si lo deseas -->
            <img src="IMG-references/me/image.jpg" alt="Contact" />
        </div>
        <div class="contact-form-wrapper">
            <form class="contact-form" id="contact-form" autocomplete="on">
                <h2>Contacto</h2>
                <p>Al enviar, se abrirá tu aplicación de correo con el mensaje preparado.</p>
                <label for="name">Nombre y apellidos</label>
                <input type="text" id="name" name="name" required placeholder="Tu nombre y apellidos">

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tucorreo@email.com">

                <label for="subject">Asunto</label>
                <input type="text" id="subject" name="subject" required placeholder="Motivo del mensaje">

                <label for="message">Mensaje</label>
                <textarea id="message" name="message" rows="4" required placeholder="Escribe tu mensaje..."></textarea>

                <button type="submit">Enviar</button>
                <p id="form-status" role="status" aria-live="polite" hidden></p>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const form = event.currentTarget;
            const formData = new FormData(form);
            const name = formData.get('name').toString().trim();
            const email = formData.get('email').toString().trim();
            const subject = formData.get('subject').toString().trim();
            const message = formData.get('message').toString().trim();
            const body = [
                `Nombre y apellidos: ${name}`,
                `Correo electrónico: ${email}`,
                `Asunto: ${subject}`,
                '',
                message
            ].join('\n');
            const mailto = `mailto:ayoubechilah@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

            const status = document.getElementById('form-status');
            status.textContent = 'Si no se abre tu aplicación de correo, escribe a ayoubechilah@gmail.com.';
            status.hidden = false;
            window.location.href = mailto;
        });
    </script>
</body>
</html>
