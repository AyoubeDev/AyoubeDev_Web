<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="styleContactMe.css">
</head>
<body>
    <div class="contact-container">
        <div class="contact-image">
            <!-- Cambia la ruta de la imagen si lo deseas -->
            <img src="IMG-references/me/image.jpg" alt="Contact" />
        </div>
        <div class="contact-form-wrapper">
            <form class="contact-form" action="send_email.php" method="POST" autocomplete="on">
                <h2>Contacto</h2>
                <label for="name">Nombre y apellidos</label>
                <input type="text" id="name" name="name" required placeholder="Tu nombre y apellidos">

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tucorreo@email.com">

                <label for="subject">Asunto</label>
                <input type="text" id="subject" name="subject" required placeholder="Motivo del mensaje">

                <label for="message">Mensaje</label>
                <textarea id="message" name="message" rows="4" required placeholder="Escribe tu mensaje..."></textarea>

                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
</body>
</html>
