    <script>
      const cards = document.querySelectorAll("#llenguatges .card");

      const maxRotate = 18;
      const ease = 0.12;

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      cards.forEach((card) => {
        let rect = card.getBoundingClientRect();
        let currentX = 0,
          currentY = 0;
        let targetX = 0,
          targetY = 0;
        let rAF = null;

        const update = () => {
          currentX = lerp(currentX, targetX, ease);
          currentY = lerp(currentY, targetY, ease);

          card.style.transform = `
            rotateX(${currentX}deg)
            rotateY(${currentY}deg)
            translateZ(40px)
        `;

          if (
            Math.abs(currentX - targetX) > 0.1 ||
            Math.abs(currentY - targetY) > 0.1
          ) {
            rAF = requestAnimationFrame(update);
          } else {
            rAF = null;
          }
        };

        const startAnimation = () => {
          if (!rAF) rAF = requestAnimationFrame(update);
        };

        card.addEventListener("mousemove", (e) => {
          // Solo actualizar el rect si realmente cambia el tamaño (más eficiente)
          rect = card.getBoundingClientRect();

          const normX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          const normY = ((e.clientY - rect.top) / rect.height) * 2 - 1;

          targetY = normX * maxRotate;
          targetX = -normY * maxRotate;

          startAnimation();
        });

        card.addEventListener("mouseleave", () => {
          targetX = 0;
          targetY = 0;
          startAnimation();
        });
      });
    </script>
